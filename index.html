<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPUB 编辑器</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="style.css?v=1.0.7">
</head><body>
<header id="topbar">
  <div class="brand">EPUB</div>
  <button id="saveBtn" class="primary" title="保存 (Ctrl+S)" disabled>保存</button>
  <button id="reloadBtn" title="重新加载">重新加载</button>
  <button id="findBtn" title="查找 / 替换 (Ctrl+F)">查找</button>
  <span id="bookName" class="book-name">未打开 EPUB</span>
  <span id="dirtyBadge" class="dirty" hidden>未保存</span>
  <span id="status" class="status">就绪</span>
</header>
<div id="main">
  <aside id="sidebar">
    <div class="side-head"><span>EPUB 文件</span><span id="fileCount"></span><button id="newChapterBtn" class="side-btn" type="button" title="新建 XHTML 章节并写入 OPF/目录">＋章节</button></div>
    <input id="filter" type="text" placeholder="筛选文件…" spellcheck="false">
    <div id="tree" class="tree"></div>
  </aside>
  <section id="sourcePane">
    <div class="pane-head"><span id="currentFile">未选择文件</span><span id="fileMode" class="muted"></span><span id="cursorInfo" class="muted">Ln 1, Col 1</span></div>
    <div id="findBar" class="find-bar" hidden>
      <input id="findInput" type="text" placeholder="查找…" spellcheck="false">
      <span id="findCount">0/0</span>
      <button id="findPrev" type="button" title="上一个 (Shift+Enter)">↑</button>
      <button id="findNext" type="button" title="下一个 (Enter)">↓</button>
      <input id="replaceInput" type="text" placeholder="替换为…" spellcheck="false">
      <button id="replaceOne" type="button">替换</button>
      <button id="replaceAll" type="button">全部</button>
      <button id="findClose" type="button" class="find-close" title="关闭 (Esc)">×</button>
    </div>
    <textarea id="code"></textarea>
  </section>
  <section id="previewPane">
    <div class="pane-head"><span>预览</span><span id="previewInfo" class="muted"></span></div>
    <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </section>
</div>
<div id="empty" class="empty" hidden><div>把 EPUB 拖到这里，或从阅读器打开</div></div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
<script src="app.js?v=1.0.7"></script>
</body></html>
