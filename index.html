<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPUB 编辑器</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<style id="lyra-theme-inline">
/* EPUB 编辑器 —— 主题与现代化界面 */
:root,html[data-theme="lyra"]{
  --bg:#0a0f16; --bg-deep:#070b11; --panel:#101823; --panel-2:#141e2b; --bar:#0d151f;
  --border:#223040; --line:#192633; --text:#e6eef7; --muted:#8fa2b6;
  --accent:#66ccff; --accent-2:#2f86f6; --accent-ink:#06121f; --sel:#183a52;
  --code-bg:#090f16; --code-text:#dbe8f5; --card:#ffffff;
  --shadow:0 18px 44px rgba(0,0,0,.38); --shadow-soft:0 8px 22px rgba(0,0,0,.22);
  --syn-tag:#7cc4ff; --syn-attr:#9ad7ff; --syn-string:#9be7a8; --syn-comment:#63798f; --syn-keyword:#c792ea; --syn-number:#f6c177;
}
html[data-theme="violet"]{
  --bg:#0d0a15; --bg-deep:#090711; --panel:#13101f; --panel-2:#1a1429; --bar:#110d1c;
  --border:#2d2342; --line:#241b35; --text:#ece5fb; --muted:#9b8fb8;
  --accent:#b388ff; --accent-2:#7c4dff; --accent-ink:#0b0714; --sel:#30224f;
  --code-bg:#0e0a18; --code-text:#e4dcf5; --card:#ffffff;
  --shadow:0 18px 44px rgba(0,0,0,.44); --shadow-soft:0 8px 22px rgba(0,0,0,.26);
  --syn-tag:#c3a4ff; --syn-attr:#d8c5ff; --syn-string:#9be7a8; --syn-comment:#71658a; --syn-keyword:#ff9ecd; --syn-number:#f6c177;
}
html[data-theme="emerald"]{
  --bg:#06110e; --bg-deep:#040d0a; --panel:#0b1713; --panel-2:#0f201a; --bar:#08140f;
  --border:#1a3028; --line:#142720; --text:#d3f0e2; --muted:#7fa89a;
  --accent:#5ce1a0; --accent-2:#1fbf7a; --accent-ink:#03130c; --sel:#123a2c;
  --code-bg:#07120e; --code-text:#d3f0e2; --card:#ffffff;
  --shadow:0 18px 44px rgba(0,0,0,.38); --shadow-soft:0 8px 22px rgba(0,0,0,.22);
  --syn-tag:#82e6b5; --syn-attr:#a7f0ce; --syn-string:#e5f0a8; --syn-comment:#5c8174; --syn-keyword:#ffb2d0; --syn-number:#ffd28a;
}
html[data-theme="sunset"]{
  --bg:#140d0a; --bg-deep:#100907; --panel:#1b1310; --panel-2:#241a15; --bar:#170f0b;
  --border:#3a281f; --line:#2e211a; --text:#f4e2d7; --muted:#b79a88;
  --accent:#ff9f6e; --accent-2:#f2643c; --accent-ink:#1a0b05; --sel:#43291f;
  --code-bg:#150e0b; --code-text:#f4e2d7; --card:#ffffff;
  --shadow:0 18px 44px rgba(0,0,0,.42); --shadow-soft:0 8px 22px rgba(0,0,0,.24);
  --syn-tag:#ffb98d; --syn-attr:#ffd0ae; --syn-string:#c9e8a0; --syn-comment:#8a7464; --syn-keyword:#ff9eb5; --syn-number:#ffd28a;
}
html[data-theme="sakura"]{
  --bg:#f4eef3; --bg-deep:#ede5ec; --panel:#fffafd; --panel-2:#fff5fa; --bar:#fffafd;
  --border:#f0d4e2; --line:#f6e2ec; --text:#4a2c3a; --muted:#9a7b8c;
  --accent:#e05a93; --accent-2:#c73d78; --accent-ink:#ffffff; --sel:#ffe0ec;
  --code-bg:#fffafd; --code-text:#3d2a35; --card:#ffffff;
  --shadow:0 18px 44px rgba(120,50,80,.10); --shadow-soft:0 8px 22px rgba(120,50,80,.08);
  --syn-tag:#b23c74; --syn-attr:#8b4b9e; --syn-string:#0b7a52; --syn-comment:#9a8a94; --syn-keyword:#a02d6b; --syn-number:#8a4fd0;
}
html[data-theme="light"]{
  --bg:#e9eef5; --bg-deep:#e2e9f2; --panel:#f8fafc; --panel-2:#ffffff; --bar:#ffffff;
  --border:#d5e1ec; --line:#e3ecf4; --text:#1f2f3f; --muted:#64788b;
  --accent:#2f86f6; --accent-2:#1d6fe0; --accent-ink:#ffffff; --sel:#dceafd;
  --code-bg:#fbfdff; --code-text:#243447; --card:#ffffff;
  --shadow:0 18px 44px rgba(35,70,110,.12); --shadow-soft:0 8px 22px rgba(35,70,110,.08);
  --syn-tag:#0b6aa8; --syn-attr:#8b4b9e; --syn-string:#0b7a52; --syn-comment:#8b98a6; --syn-keyword:#a02d6b; --syn-number:#7b3fd3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 70% -20%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 65%),var(--bg);color:var(--text);font:13px/1.55 "Segoe UI Variable Text","Microsoft YaHei UI",system-ui,sans-serif;overflow:hidden;transition:background .2s,color .2s}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .08s}
button:hover{background:color-mix(in srgb,var(--accent) 11%,var(--panel-2));border-color:color-mix(in srgb,var(--accent) 55%,var(--border));color:var(--accent)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:650;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 24%,transparent)}
button.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
button:disabled{opacity:.38;cursor:default;transform:none;box-shadow:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 30%,transparent);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent) 45%,transparent);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

#topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 14px;background:color-mix(in srgb,var(--bar) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font:800 10px/1 "Segoe UI",system-ui;letter-spacing:.03em;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 22%,transparent);margin-right:2px}
.book-name{color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;margin-left:2px}
.book-name::before{content:"·";color:var(--muted);margin-right:7px}
.dirty{background:color-mix(in srgb,#ffb15c 18%,transparent);color:#ffca7a;border:1px solid color-mix(in srgb,#ffb15c 30%,transparent);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600}
html[data-theme="light"] .dirty,html[data-theme="sakura"] .dirty{color:#a15c00;background:#fff2dd;border-color:#f3d5a7}
.status{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.theme-select{margin-left:auto;height:28px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:8px;padding:0 8px;font-size:11px;outline:none;cursor:pointer}
.theme-select:hover{border-color:var(--accent)}
#topbar .status{margin-left:0}

#main{display:grid;grid-template-columns:258px minmax(0,1fr) minmax(0,1fr);height:calc(100% - 56px);min-height:0;gap:0}
#sidebar{border-right:1px solid var(--line);min-height:0;display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 96%,transparent);padding:12px 10px}
.side-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:650}
.side-head #fileCount{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font:10px/18px Consolas,monospace;letter-spacing:0;margin-left:4px}
.side-btn{margin-left:auto;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:7px;padding:3px 8px;font:10.5px/1.5 system-ui;letter-spacing:0;text-transform:none;cursor:pointer}
.side-btn:hover{border-color:var(--accent);color:var(--accent)}
#filter{width:100%;height:32px;margin:0 0 8px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-deep);color:var(--text);outline:none;font-size:12px;transition:border-color .14s,box-shadow .14s}
#filter::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
#filter:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
#tree{overflow:auto;flex:1;padding:2px 0 12px;margin:0 -2px}
.tree-item{display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 8px;border-radius:7px;color:color-mix(in srgb,var(--text) 82%,var(--muted));cursor:pointer;white-space:nowrap;overflow:hidden;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s}
.tree-item:hover{background:color-mix(in srgb,var(--accent) 8%,var(--panel-2));color:var(--text)}
.tree-item.active{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border-color:color-mix(in srgb,var(--accent) 26%,var(--line));color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.tree-item .icon{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;border-radius:5px;background:var(--panel-2);color:var(--muted);font:700 9px/1 Consolas,monospace;border:1px solid var(--line)}
.tree-item.active .icon{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.tree-item .rel{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;font-size:11.5px;font-family:Consolas,"Cascadia Mono",monospace}
.tree-item .tree-del{flex:0 0 auto;width:18px;height:18px;line-height:16px;text-align:center;border-radius:5px;color:var(--muted);opacity:0;font-size:14px}
.tree-item:hover .tree-del{opacity:1}
.tree-item .tree-del:hover{background:color-mix(in srgb,#ff5c7a 20%,transparent);color:#ff8a9a}
.tree-item.dirty .icon{color:#ffca7a;border-color:color-mix(in srgb,#ffca7a 40%,var(--line))}
.tree-empty{color:var(--muted);padding:16px 10px;text-align:center;font-size:12px}

#sourcePane,#previewPane{min-width:0;min-height:0;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 55%,var(--panel))}
#sourcePane{border-right:1px solid var(--line);position:relative}
.pane-head{height:40px;flex:0 0 40px;display:flex;align-items:center;gap:9px;padding:0 12px;background:color-mix(in srgb,var(--bar) 72%,var(--panel));border-bottom:1px solid var(--line);color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden}
#currentFile{color:var(--text);font:11.5px Consolas,"Cascadia Mono",monospace;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pane-head .muted{color:var(--muted);margin-left:0}
#fileMode{padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;background:var(--panel-2)}
#cursorInfo{margin-left:auto;font-family:Consolas,monospace;font-size:10px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
#previewPane .pane-head .muted{margin-left:auto}

.CodeMirror{height:calc(100% - 40px) !important;font:13px/1.65 Consolas,"Cascadia Mono",monospace;background:var(--code-bg) !important;color:var(--code-text) !important}
.CodeMirror-gutters{background:var(--code-bg) !important;border-right:1px solid var(--line) !important}
.CodeMirror-linenumber{color:color-mix(in srgb,var(--muted) 78%,var(--code-bg)) !important}
.CodeMirror-cursor{border-left:2px solid var(--accent) !important}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--sel) !important}
.CodeMirror-activeline-background{background:color-mix(in srgb,var(--accent) 5%,transparent) !important}
.CodeMirror-matchingbracket{color:var(--accent) !important;text-decoration:underline}
.cm-s-default .cm-tag{color:var(--syn-tag)}
.cm-s-default .cm-attribute,.cm-s-default .cm-qualifier{color:var(--syn-attr)}
.cm-s-default .cm-string{color:var(--syn-string)}
.cm-s-default .cm-comment{color:var(--syn-comment);font-style:italic}
.cm-s-default .cm-keyword,.cm-s-default .cm-atom{color:var(--syn-keyword)}
.cm-s-default .cm-number{color:var(--syn-number)}
.cm-s-default .cm-property{color:var(--syn-tag)}
.cm-s-default .cm-variable{color:var(--code-text)}

#preview{margin:14px;width:calc(100% - 28px);height:calc(100% - 28px);border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow-soft)}

.find-bar{position:absolute;top:48px;right:16px;z-index:12;display:flex;align-items:center;gap:6px;padding:7px 9px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.find-bar[hidden]{display:none !important}
.find-bar input{height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg-deep);color:var(--text);padding:0 8px;font:11.5px/26px Consolas,monospace;outline:none}
.find-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
#findInput{width:160px}#replaceInput{width:150px}
#findCount{color:var(--muted);font:10px/1 Consolas,monospace;min-width:40px;text-align:center}
.find-bar button{height:28px;padding:0 9px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font:11px/26px system-ui;cursor:pointer}
.find-bar button:hover{border-color:var(--accent);color:var(--accent)}
.find-bar .find-close{padding:0 7px;font-size:14px}

.empty{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--muted);text-align:center;padding:30px;z-index:100;backdrop-filter:blur(8px)}
.empty[hidden]{display:none !important}
.empty button{margin-top:12px}
.back-btn{border:1px solid color-mix(in srgb,var(--accent) 55%,var(--border)) !important;background:color-mix(in srgb,var(--accent) 13%,var(--panel-2)) !important;color:var(--accent) !important;font-weight:650 !important;padding:0 13px !important;height:30px !important;border-radius:8px !important}
.back-btn:hover{background:color-mix(in srgb,var(--accent) 20%,var(--panel-2)) !important}
#topbar button{height:30px;padding:0 12px;font:11.5px/28px system-ui;border-radius:8px;background:var(--panel-2);border-color:var(--border);color:var(--text)}
#topbar button:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel-2))}
#topbar button.primary{color:var(--accent-ink);border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
#topbar button.primary:hover{color:var(--accent-ink)}
#saveBtn{padding:0 16px !important}
@media(max-width:1000px){#main{grid-template-columns:220px minmax(0,1fr)}#previewPane{display:none}}

/* ===== 预览：连续 / 分页 ===== */
.preview-head{gap:8px}
.preview-head .preview-title{color:var(--text);font-weight:600;font-size:11.5px}
#previewInfo{color:var(--muted);font-size:10.5px}
.preview-tools{margin-left:auto;display:flex;align-items:center;gap:7px}
.seg-toggle{display:flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg-deep);gap:2px}
.seg-toggle button{border:0;background:transparent;color:var(--muted);padding:2px 9px;border-radius:6px;font:10.5px/1.5 system-ui;cursor:pointer;height:22px}
.seg-toggle button:hover{color:var(--text)}
.seg-toggle button.active{background:color-mix(in srgb,var(--accent) 18%,var(--panel-2));color:var(--accent);font-weight:600}
.page-nav{display:flex;align-items:center;gap:3px;border:1px solid var(--border);background:var(--bg-deep);border-radius:8px;padding:2px 4px;height:26px}
.page-nav[hidden]{display:none !important}
.page-nav button{border:0;background:transparent;color:var(--text);width:22px;height:22px;padding:0;border-radius:5px;font:15px/20px Consolas,monospace;cursor:pointer}
.page-nav button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.page-nav button:disabled{opacity:.25;cursor:default}
#pageLabel{color:var(--muted);font:10px/1 Consolas,monospace;min-width:44px;text-align:center}
.preview-select{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--panel-2);color:var(--text);padding:0 6px;font-size:10.5px;outline:none;cursor:pointer}
.preview-select:hover{border-color:var(--accent)}
.font-tools{display:flex;align-items:center;gap:2px;height:26px;border:1px solid var(--border);border-radius:8px;background:var(--bg-deep);padding:1px 3px}
.font-tools button{border:0;background:transparent;color:var(--muted);width:24px;height:22px;padding:0;border-radius:5px;font:10px/20px system-ui;cursor:pointer}
.font-tools button:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
#fontLabel{color:var(--muted);font:10px/1 Consolas,monospace;min-width:20px;text-align:center}
@media(max-width:1180px){.font-tools{display:none}.preview-select{max-width:70px}}

/* ===== 保存前检查 ===== */
.validate-overlay{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);padding:24px}
.validate-overlay[hidden]{display:none !important}
.validate-card{width:min(680px,100%);max-height:min(620px,80vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.validate-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.validate-count{margin-left:auto;color:var(--muted);font:10px/1 Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.validate-list{overflow:auto;padding:8px 12px;flex:1;min-height:120px}
.validate-row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start;padding:7px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:12px}
.validate-row:last-child{border-bottom:0}
.validate-row .sev{text-align:center;font-weight:700}
.validate-row.error .sev{color:#ff6b86}
.validate-row.warn .sev{color:#ffca7a}
.validate-row .msg{color:var(--text);line-height:1.55;overflow-wrap:anywhere}
.validate-row .file{display:block;color:var(--muted);font:10px/1.5 Consolas,monospace;margin-top:2px}
.validate-empty{padding:22px;text-align:center;color:var(--muted);font-size:12px}
.validate-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bar)}
.validate-actions button{height:30px;padding:0 14px;border-radius:7px;font-size:12px}
.validate-actions .primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:600}

/* ===== 章节与目录 ===== */
.outline-overlay{position:fixed;inset:0;z-index:290;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);padding:24px}
.outline-overlay[hidden]{display:none !important}
.outline-card{width:min(760px,100%);max-height:min(680px,86vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.outline-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.outline-meta{margin-left:auto;color:var(--muted);font:10px/1 Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.outline-hint{padding:9px 16px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);background:var(--bar)}
.outline-list{overflow:auto;padding:8px 10px;flex:1;min-height:120px}
.outline-row{display:grid;grid-template-columns:22px 22px minmax(0,1fr) minmax(120px,.65fr);gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel-2);cursor:grab}
.outline-row.dragging{opacity:.45}
.outline-row.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.outline-handle{color:var(--muted);font:12px/1 Consolas,monospace;text-align:center;user-select:none}
.outline-row input{border:1px solid transparent;background:transparent;color:var(--text);font:12.5px/1.5 system-ui;padding:3px 5px;border-radius:5px;outline:none;min-width:0}
.outline-row input:hover{border-color:var(--border)}
.outline-row input:focus{background:var(--bg-deep);border-color:var(--accent)}

/* ===== 全书搜索 / 替换 ===== */
.global-find-overlay{position:fixed;inset:0;z-index:295;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);padding:24px}

.global-find-card{width:min(860px,100%);max-height:min(720px,88vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.global-find-head{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.gf-count{margin-left:auto;color:var(--muted);font:10px/1 Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.gf-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bar)}
.gf-controls input[type=text]{height:30px;border:1px solid var(--border);border-radius:7px;background:var(--bg-deep);color:var(--text);padding:0 9px;font:12px Consolas,monospace;outline:none}

.gf-controls input[type=text]:focus{border-color:var(--accent)}
.gf-check{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;cursor:pointer}

.gf-file span{margin-left:auto;color:var(--muted)}

.gf-row:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.gf-line{color:var(--muted);text-align:right}
.gf-snippet{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gf-snippet mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent);border-radius:2px;padding:0 1px}
.gf-empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}

/* ===== 软换行 ===== */
#wrapBtn.active{background:color-mix(in srgb,var(--accent) 16%,var(--panel-2));border-color:var(--accent);color:var(--accent);font-weight:600}

/* ===== 书籍元数据 ===== */
.meta-overlay{position:fixed;inset:0;z-index:294;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);padding:24px}
.meta-overlay[hidden]{display:none !important}
.meta-card{width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.meta-head{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.meta-file{margin-left:auto;color:var(--muted);font:10px/1 Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.meta-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 16px;overflow:auto}
.meta-fields label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:11px}
.meta-fields label.wide{grid-column:1 / -1}
.meta-fields input,.meta-fields textarea{border:1px solid var(--border);border-radius:7px;background:var(--bg-deep);color:var(--text);padding:6px 8px;font:12px/1.5 "Segoe UI",system-ui;outline:none;resize:vertical}
.meta-fields input:focus,.meta-fields textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.meta-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bar)}
.meta-actions button{height:30px;padding:0 14px;border-radius:7px;font-size:12px}
.meta-actions .primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:600}

/* ===== 图片与封面 ===== */
.assets-overlay{position:fixed;inset:0;z-index:296;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);padding:24px}
.assets-overlay[hidden]{display:none !important}
.assets-card{width:min(820px,100%);height:min(680px,88vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.assets-head{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.assets-count{margin-left:auto;color:var(--muted);font:10px/1 Consolas,monospace;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.assets-toolbar{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bar)}
.assets-import{border:1px solid var(--border);border-radius:7px;background:var(--panel-2);color:var(--text);padding:5px 11px;font-size:11px;cursor:pointer}
.assets-import:hover{border-color:var(--accent);color:var(--accent)}
.assets-hint{color:var(--muted);font-size:11px}
.assets-grid{overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start;flex:1}
.asset-card{border:2px solid var(--border);background:var(--panel-2);border-radius:9px;overflow:hidden;cursor:pointer;transition:border-color .12s,box-shadow .12s}

.asset-thumb img{max-width:100%;max-height:110px;object-fit:contain;display:block}
.asset-name{padding:6px 7px;color:var(--text);font:10px/1.4 Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset-name small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.assets-empty{grid-column:1 / -1;padding:40px;text-align:center;color:var(--muted);font-size:12px}
.assets-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bar)}
.assets-actions button{height:30px;padding:0 14px;border-radius:7px;font-size:12px}
.assets-actions .primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:600}

/* ===== 自动保存 ===== */
.auto-save-select{max-width:92px}
#autoSaveSelect option{background:var(--panel);color:var(--text)}

/* ===== 章节拆分 / 合并 ===== */
#splitChapterBtn,#mergeChapterBtn{margin-left:2px}
#splitChapterBtn:disabled,#mergeChapterBtn:disabled{opacity:.35;cursor:default;color:var(--muted)}

/* 侧栏章节工具条 */
.side-tools{display:flex;gap:4px;padding:0 8px 7px}
.side-tools .side-btn{flex:1;min-width:0;margin:0;padding:3px 2px;white-space:nowrap;font-size:10px;text-align:center}

/* ===== 检查结果展示 ===== */
.validate-list{padding:0}
.validate-summary{display:flex;align-items:stretch;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bar)}
.vs-card{display:flex;align-items:baseline;gap:5px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.vs-card b{font:700 18px/1 "Segoe UI",system-ui}
.vs-card span{font-size:10px;color:var(--muted)}
.vs-card.error{border-color:color-mix(in srgb,#ff6b86 40%,var(--line));background:color-mix(in srgb,#ff6b86 8%,var(--panel))}
.vs-card.error b{color:#ff6b86}
.vs-card.warn{border-color:color-mix(in srgb,#ffca7a 40%,var(--line));background:color-mix(in srgb,#ffca7a 7%,var(--panel))}
.vs-card.warn b{color:#ffca7a}
.vs-tip{flex:1;align-self:center;color:var(--muted);font-size:11px;line-height:1.5;padding-left:4px}
.validate-filters{display:flex;gap:5px;padding:9px 14px 4px}

.validate-filter.active{background:color-mix(in srgb,var(--accent) 14%,var(--panel-2));border-color:var(--accent);color:var(--accent);font-weight:600}

.validate-row.error{background:color-mix(in srgb,#ff6b86 3%,transparent)}

#formatBtn{white-space:nowrap}

.assets-actions .danger:disabled{opacity:.35;color:var(--muted);border-color:var(--border);background:transparent}

.edit-mode-toggle button.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.edit-mode-toggle button:disabled{opacity:.35;cursor:default}
#cursorInfo{margin-left:0}
.doc-pane{position:absolute;top:40px;left:0;right:0;bottom:0;z-index:8;display:flex;flex-direction:column;background:#ded5c6}
.doc-pane[hidden]{display:none !important}

#sourcePane.doc-mode #findBar{display:none !important}
.doc-toolbar{flex:0 0 38px;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);overflow:hidden}
.doc-toolbar button{height:24px;min-width:26px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);color:var(--text);font-size:10.5px;cursor:pointer}

.doc-scroll{flex:1;min-height:0;overflow:auto;padding:22px 20px 60px}
.doc-editor{width:min(820px,100%);min-height:calc(100vh - 190px);margin:0 auto;background:#fbf7ef;color:#2d2922;border-radius:3px;box-shadow:0 10px 35px rgba(0,0,0,.18);padding:54px 62px 70px;font:17px/1.95 "Noto Serif SC","Source Han Serif SC","Songti SC",serif;outline:none}

.doc-editor h1,.doc-editor h2,.doc-editor h3{color:#211d17;line-height:1.35;margin:1.1em 0 .55em;font-weight:700}
.doc-editor h1{font-size:2em}.doc-editor h2{font-size:1.5em}.doc-editor h3{font-size:1.22em}

.outline-row{grid-template-columns:22px 34px minmax(0,1fr) minmax(120px,.65fr)}

        <label class="follow-reader" title="分页预览直接使用阅读器当前主题、字号、行高和页宽"><input id="followReader" type="checkbox">跟随阅读器</label>
        <select id="previewTheme" class="preview-select" title="阅读主题">
          <option value="sepia">米黄</option>
          <option value="paper">白纸</option>
          <option value="green">护眼绿</option>
          <option value="dark">暗色</option>
          <option value="nightblue">夜蓝</option>
        </select>
        <div class="font-tools" title="阅读字号">
          <button id="fontDown" type="button">A−</button><span id="fontLabel">20</span><button id="fontUp" type="button">A+</button>
        </div>
      </div>
    </div>
    <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </section>
</div>
<div id="empty" class="empty" hidden><div>把 EPUB 拖到这里，或从阅读器打开</div></div>
<div id="assetsOverlay" class="assets-overlay" hidden>
  <div class="assets-card">
    <div class="assets-head"><span>图片与封面</span><span id="assetsCount" class="assets-count"></span></div>
    <div class="assets-toolbar">
      <label class="assets-import">导入图片<input id="assetFiles" type="file" accept="image/*" multiple hidden></label>
      <span id="assetInfo" class="assets-info">点击图片卡片选中</span>
    </div>
    <div id="assetsGrid" class="assets-grid"></div>
    <div class="assets-actions"><button id="assetDelete" type="button" class="danger">删除图片</button><button id="assetsClose" type="button">关闭</button><button id="assetInsert" type="button">插入到当前章节</button><button id="assetCover" type="button" class="primary">设为封面</button></div>
  </div>
</div>
<div id="metaOverlay" class="meta-overlay" hidden>
  <div class="meta-card">
    <div class="meta-head"><span>书籍信息</span><span id="metaFile" class="meta-file"></span></div>
    <div class="meta-fields">
      <label>书名<input id="metaTitle" type="text" spellcheck="false"></label>
      <label>作者<input id="metaCreator" type="text" spellcheck="false"></label>
      <label>语言<input id="metaLanguage" type="text" spellcheck="false" placeholder="例如 zh-CN"></label>
      <label>出版者<input id="metaPublisher" type="text" spellcheck="false"></label>
      <label>日期<input id="metaDate" type="text" spellcheck="false" placeholder="YYYY-MM-DD"></label>
      <label>标识符<input id="metaIdentifier" type="text" spellcheck="false"></label>
      <label class="wide">简介<textarea id="metaDescription" rows="4" spellcheck="false"></textarea></label>
    </div>
    <div class="meta-actions"><button id="metaCancel" type="button">取消</button><button id="metaApply" type="button" class="primary">应用</button></div>
  </div>
</div>
<div id="globalFindOverlay" class="global-find-overlay" hidden>
  <div class="global-find-card">
    <div class="global-find-head"><span>全书搜索与替换</span><span id="globalFindCount" class="gf-count"></span></div>
    <div class="gf-controls">
      <input id="gfQuery" type="text" placeholder="查找内容…" spellcheck="false">
      <input id="gfReplace" type="text" placeholder="替换为…" spellcheck="false">
      <label class="gf-check"><input id="gfRegex" type="checkbox">正则</label>
      <label class="gf-check"><input id="gfCase" type="checkbox">区分大小写</label>
      <button id="gfSearch" type="button">搜索</button>
      <button id="gfReplaceAll" type="button" class="primary">全部替换</button>
      <button id="gfClose" type="button" class="ghost">关闭</button>
    </div>
    <div id="gfResults" class="gf-results"></div>
  </div>
</div>
<div id="previewMenu" class="preview-menu" hidden>
  <div class="preview-menu-head">在编辑器中定位</div>
  <button type="button" data-jump-mode="source">跳到源码位置</button>
  <button type="button" data-jump-mode="doc">在文档模式中定位</button>
</div>
<div id="outlineOverlay" class="outline-overlay" hidden>
  <div class="outline-card">
    <div class="outline-head"><span>章节与目录</span><span id="outlineMeta" class="outline-meta"></span></div>
    <div class="outline-hint">拖动行调整阅读顺序；修改标题后点「应用」写回 OPF / 目录 / 章节标题。</div>
    <div id="outlineList" class="outline-list"></div>
    <div class="outline-actions"><button id="outlineCancel" type="button">取消</button><button id="outlineApply" type="button" class="primary">应用</button></div>
  </div>
</div>
<div id="validateOverlay" class="validate-overlay" hidden>
  <div class="validate-card">
    <div class="validate-head"><span>保存前检查</span><span id="validateCount" class="validate-count"></span></div>
    <div id="validateList" class="validate-list"></div>
    <div class="validate-actions">
      <button id="validateCancel" type="button">取消</button>
      <button id="validateSave" type="button" class="primary">仍然保存</button>
    </div>
  </div>
</div>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/xml/xml.min.js"></script>
<script src="vendor/codemirror/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="vendor/codemirror/mode/css/css.min.js"></script>
<script src="vendor/codemirror/mode/javascript/javascript.min.js"></script>
